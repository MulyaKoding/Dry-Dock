services:
  # Backend API Service (Express + TypeScript)
  backend:
    build:
      context: ./dry-dock-BE
      dockerfile: Dockerfile
    container_name: dry-dock-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      CLIENT_URL: http://localhost:3000
      # Connect to MySQL running directly on the Host machine
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: "@Permata2026"
      DB_NAME: dry_dock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Frontend Web App (Nuxt 3)
  frontend:
    build:
      context: ./dry-dock-FE
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:4000/api
    container_name: dry-dock-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: http://localhost:4000/api
    depends_on:
      - backend
