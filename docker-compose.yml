services:
  # Backend API Service (Express + TypeScript)
  backend:
    build:
      context: ./dry-dock-BE
      dockerfile: Dockerfile
    container_name: dry-dock-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./dry-dock-BE/.env

  # Frontend Web App (Nuxt 3)
  frontend:
    build:
      context: ./dry-dock-FE
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: http://localhost:4000/api
    container_name: dry-dock-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NUXT_PUBLIC_API_BASE: http://localhost:4000/api
    depends_on:
      - backend
